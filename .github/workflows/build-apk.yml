name: Build and Generate Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Environment Variables (.env)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APPLICATION_ID: ${{ secrets.FIREBASE_APPLICATION_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FUNKYTALK_BACKEND_URL: ${{ secrets.FUNKYTALK_BACKEND_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_TEMPLATE_ID: ${{ secrets.BREVO_TEMPLATE_ID }}
        run: |
          python3 -c '
          import os

          env_file = os.environ.get("ENV_FILE")
          if env_file:
              print("Creating .env from GitHub Secret ENV_FILE...")
              with open(".env", "w") as f:
                  f.write(env_file)
          elif not os.path.exists(".env"):
              print("Creating .env from .env.example...")
              with open(".env.example", "r") as src, open(".env", "w") as dst:
                  dst.write(src.read())
          else:
              print("Using existing .env file...")

          # Read current .env
          env_vars = {}
          if os.path.exists(".env"):
              with open(".env", "r") as f:
                  for line in f:
                      line = line.strip()
                      if line and not line.startswith("#") and "=" in line:
                          k, v = line.split("=", 1)
                          env_vars[k.strip()] = v.strip()

          # Override with any individual GitHub Secrets if provided
          keys_to_check = [
              "GEMINI_API_KEY",
              "GOOGLE_WEB_CLIENT_ID",
              "FIREBASE_API_KEY",
              "FIREBASE_APPLICATION_ID",
              "FIREBASE_PROJECT_ID",
              "SUPABASE_URL",
              "SUPABASE_ANON_KEY",
              "FUNKYTALK_BACKEND_URL",
              "BREVO_API_KEY",
              "BREVO_TEMPLATE_ID"
          ]

          for k in keys_to_check:
              val = os.environ.get(k)
              if val and val.strip():
                  env_vars[k] = val.strip()

          with open(".env", "w") as f:
              for k, v in env_vars.items():
                  f.write(f"{k}={v}\n")

          print("Configured .env keys:", list(env_vars.keys()))
          '
          echo "Environment configuration completed."

      - name: Setup Keystores, Configure Signing & Extract SHA Fingerprints
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || 'FunkyTalk2026!' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'FunkyTalk2026!' }}
        run: python3 .github/scripts/setup_keystore.py

      - name: Build Debug APK with Gradle
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunkyTalk-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Keystore and SHA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FunkyTalk-Keystore-and-SHA
          path: keystore-artifacts/*
          retention-days: 90

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-build-${{ github.run_number }}
          name: "FunkyTalk Android APK (Build #${{ github.run_number }})"
          body: |
            ### 🚀 FunkyTalk Automated Android APK Build #${{ github.run_number }}
            
            - **Commit**: `${{ github.sha }}`
            - **Package**: `com.aistudio.funkytalk.kxmpzq`
            - **Type**: Debug APK (Ready to install directly on Android phones)
            
            ---
            
            ### 🔑 Keystore & Firebase SHA-1 Fingerprints
            
            #### 📱 Debug APK Fingerprint (Copy this into Firebase Console):
            ```text
            ${{ steps.keystore.outputs.debug_sha1 }}
            ```
            - **SHA-256**: `${{ steps.keystore.outputs.debug_sha256 }}`
            - **Keystore File**: `debug.keystore` (download below)
            - **Password**: `android` | **Alias**: `androiddebugkey`
            
            #### 🔐 Release Keystore Fingerprint:
            ```text
            ${{ steps.keystore.outputs.release_sha1 }}
            ```
            - **SHA-256**: `${{ steps.keystore.outputs.release_sha256 }}`
            - **Keystore File**: `funkytalk-release.keystore` (download below)
            - **Password**: `${{ steps.keystore.outputs.release_password }}` | **Alias**: `${{ steps.keystore.outputs.release_alias }}`
            
            ---
            
            ### 🛠️ Google Sign-in Setup in Firebase (Error 10 Fix):
            1. Open [Firebase Console](https://console.firebase.google.com/) -> **Project Settings** (Gear icon) -> **General**.
            2. Scroll down to **Your apps** -> Select `com.aistudio.funkytalk.kxmpzq`.
            3. Click **Add fingerprint** and paste the **SHA-1** above.
            4. Save!
            
            ---
            
            ### 📦 Download Assets:
            - **APK file**: `app-debug.apk`
            - **Keystore files & SHA info**: `debug.keystore`, `funkytalk-release.keystore`, `SHA_FINGERPRINTS.txt`
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/*.apk
            keystore-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
