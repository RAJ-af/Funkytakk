name: Build and Generate Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      upload_actions_artifacts:
        description: 'Also upload to GitHub Actions artifacts storage (consumes account quota)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

env:
  UPLOAD_ACTIONS_ARTIFACTS: ${{ github.event.inputs.upload_actions_artifacts || secrets.UPLOAD_ACTIONS_ARTIFACTS || 'false' }}

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cleanup Old Workflow Artifacts to Free Storage Quota
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up older workflow artifacts to free GitHub Actions storage quota..."
          python3 -c '
          import os, subprocess, json
          token = os.environ.get("GH_TOKEN")
          repo = os.environ.get("GITHUB_REPOSITORY")
          if not token or not repo:
              exit(0)
          try:
              res = subprocess.run(["gh", "api", f"repos/{repo}/actions/artifacts?per_page=100"], capture_output=True, text=True)
              if res.returncode == 0:
                  data = json.loads(res.stdout)
                  artifacts = data.get("artifacts", [])
                  print(f"Found {len(artifacts)} old artifacts in {repo}. Cleaning up...")
                  for a in artifacts:
                      aid = a.get("id")
                      name = a.get("name", "unknown")
                      print(f"Deleting artifact ID {aid} ({name})...")
                      subprocess.run(["gh", "api", "--method", "DELETE", f"repos/{repo}/actions/artifacts/{aid}"], capture_output=True)
                  print("Artifact cleanup completed.")
          except Exception as e:
              print(f"Artifact cleanup note: {e}")
          ' || true
        continue-on-error: true

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Environment Variables (.env)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APPLICATION_ID: ${{ secrets.FIREBASE_APPLICATION_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FUNKYTALK_BACKEND_URL: ${{ secrets.FUNKYTALK_BACKEND_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_TEMPLATE_ID: ${{ secrets.BREVO_TEMPLATE_ID }}
        run: |
          python3 -c '
          import os

          env_file = os.environ.get("ENV_FILE")
          if env_file:
              print("Creating .env from GitHub Secret ENV_FILE...")
              with open(".env", "w") as f:
                  f.write(env_file)
          elif not os.path.exists(".env"):
              print("Creating .env from .env.example...")
              with open(".env.example", "r") as src, open(".env", "w") as dst:
                  dst.write(src.read())
          else:
              print("Using existing .env file...")

          # Read current .env
          env_vars = {}
          if os.path.exists(".env"):
              with open(".env", "r") as f:
                  for line in f:
                      line = line.strip()
                      if line and not line.startswith("#") and "=" in line:
                          k, v = line.split("=", 1)
                          env_vars[k.strip()] = v.strip()

          # Override with any individual GitHub Secrets if provided
          keys_to_check = [
              "GEMINI_API_KEY",
              "GOOGLE_WEB_CLIENT_ID",
              "FIREBASE_API_KEY",
              "FIREBASE_APPLICATION_ID",
              "FIREBASE_PROJECT_ID",
              "SUPABASE_URL",
              "SUPABASE_ANON_KEY",
              "FUNKYTALK_BACKEND_URL",
              "BREVO_API_KEY",
              "BREVO_TEMPLATE_ID"
          ]

          for k in keys_to_check:
              val = os.environ.get(k)
              if val and val.strip():
                  env_vars[k] = val.strip()

          with open(".env", "w") as f:
              for k, v in env_vars.items():
                  f.write(f"{k}={v}\n")

          print("Configured .env keys:", list(env_vars.keys()))
          '
          echo "Environment configuration completed."

      - name: Ensure google-services.json is Present
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Restoring google-services.json from GitHub secret..."
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f "app/google-services.json" ]; then
            echo "Creating app/google-services.json from default template configuration..."
            mkdir -p app
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1093102729820",
              "firebase_url": "https://funkytalk-f1aae-default-rtdb.asia-southeast1.firebasedatabase.app",
              "project_id": "funkytalk-f1aae",
              "storage_bucket": "funkytalk-f1aae.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1093102729820:android:adf5504386d9f6f184c499",
                  "android_client_info": {
                    "package_name": "com.funkytalk.app"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "1093102729820-4mdub6gveu7mbl6hf16e7pu1tvk2smeb.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.funkytalk.app",
                      "certificate_hash": "ca4a705395fcc3ec0316deff4392ca8a2bb5d164"
                    }
                  },
                  {
                    "client_id": "1093102729820-7dbvqkqf7uall5go8aasmsvs89keesq6.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyAZi997wGgWE7WJ-N5NO9kOWL2agpijq-8"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "1093102729820-7dbvqkqf7uall5go8aasmsvs89keesq6.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
          echo "Verified app/google-services.json exists."

      - name: Setup Keystores, Configure Signing & Extract SHA Fingerprints
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
        run: python3 .github/scripts/setup_keystore.py

      - name: Build Debug & Release APKs with Gradle
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Check APK Outputs
        id: check_apk
        run: |
          DEBUG_EXISTS=false
          RELEASE_EXISTS=false
          MAPPING_EXISTS=false

          if compgen -G "app/build/outputs/apk/debug/*.apk" > /dev/null; then
            DEBUG_EXISTS=true
            echo "Found Debug APKs:"
            ls -lh app/build/outputs/apk/debug/*.apk
          else
            echo "::warning::No Debug APK files found in app/build/outputs/apk/debug/"
          fi

          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            RELEASE_EXISTS=true
            echo "Found Release APKs:"
            ls -lh app/build/outputs/apk/release/*.apk
          else
            echo "::warning::No Release APK files found in app/build/outputs/apk/release/"
          fi

          if [ -f "app/build/outputs/mapping/release/mapping.txt" ]; then
            MAPPING_EXISTS=true
            ls -lh app/build/outputs/mapping/release/mapping.txt
          fi

          echo "debug_apk_exists=$DEBUG_EXISTS" >> "$GITHUB_OUTPUT"
          echo "release_apk_exists=$RELEASE_EXISTS" >> "$GITHUB_OUTPUT"
          echo "mapping_exists=$MAPPING_EXISTS" >> "$GITHUB_OUTPUT"

          if [ "$DEBUG_EXISTS" = "true" ] || [ "$RELEASE_EXISTS" = "true" ]; then
            echo "apk_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "apk_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add Build Status & Direct Download Links to Summary
        if: (!cancelled()) && steps.check_apk.outputs.apk_exists == 'true'
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY

          ---

          ## 📦 Direct APK Download Links

          | Asset | Direct Link |
          | :--- | :--- |
          | 📱 **Release Universal APK (Recommended)** | ⬇️ **[Download app-universal-release.apk](https://github.com/${{ github.repository }}/releases/download/release-build-${{ github.run_number }}/app-universal-release.apk)** |
          | ⚡ **Release ARM64 APK** | ⬇️ **[Download app-arm64-v8a-release.apk](https://github.com/${{ github.repository }}/releases/download/release-build-${{ github.run_number }}/app-arm64-v8a-release.apk)** |
          | 🛠️ **Debug Universal APK** | ⬇️ **[Download app-universal-debug.apk](https://github.com/${{ github.repository }}/releases/download/release-build-${{ github.run_number }}/app-universal-debug.apk)** |
          | 📦 **GitHub Release Page** | 🔗 **[Open Release Build #${{ github.run_number }}](https://github.com/${{ github.repository }}/releases/tag/release-build-${{ github.run_number }})** |

          > 💡 **How to Install**:
          > 1. Install `app-universal-release.apk` (or `app-arm64-v8a-release.apk` for modern Android devices) from the links above.
          > 2. Split APKs for both **Debug** and **Release** are also attached on the GitHub Release page and in workflow artifacts.
          
          EOF

      - name: Upload Debug APKs Artifact to GitHub Summary
        if: (!cancelled()) && steps.check_apk.outputs.debug_apk_exists == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-debug-apk-build-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3

      - name: Upload Release APKs Artifact to GitHub Summary
        if: (!cancelled()) && steps.check_apk.outputs.release_apk_exists == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-release-apk-build-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 3

      - name: Upload Keystore and SHA Artifacts
        if: env.UPLOAD_ACTIONS_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: FunkyTalk-Keystore-and-SHA-${{ github.run_number }}
          path: keystore-artifacts/*
          retention-days: 3

      - name: Create GitHub Release (Direct Debug & Release APKs)
        if: (!cancelled()) && steps.check_apk.outputs.apk_exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-build-${{ github.run_number }}
          name: "FunkyTalk Android APKs (Build #${{ github.run_number }})"
          body: |
            ### 🚀 FunkyTalk Automated Android Build #${{ github.run_number }}
            
            - **Commit**: `${{ github.sha }}`
            - **Package**: `com.funkytalk.app`
            - **Variants**: Debug + Signed Release (`arm64-v8a`, `armeabi-v7a`, `universal`)
            
            ---
            
            ### 🔑 Keystore & Firebase SHA-1 Fingerprints
            
            #### 📱 Debug APK Fingerprint (Copy this into Firebase Console):
            ```text
            ${{ steps.keystore.outputs.debug_sha1 }}
            ```
            - **SHA-256**: `${{ steps.keystore.outputs.debug_sha256 }}`
            - **Keystore File**: `debug.keystore` (attached below)
            - **Password**: `android` | **Alias**: `androiddebugkey`
            
            #### 🔐 Release Keystore Fingerprint:
            ```text
            ${{ steps.keystore.outputs.release_sha1 }}
            ```
            - **SHA-256**: `${{ steps.keystore.outputs.release_sha256 }}`
            - **Keystore File**: `funkytalk-release.keystore` (attached below)
            - **Password**: *(Configured in GitHub Secrets: KEYSTORE_PASSWORD)* | **Alias**: `${{ steps.keystore.outputs.release_alias }}`
            
            ---
            
            ### 🛠️ Google Sign-in Setup in Firebase (Error 10 Fix):
            1. Open [Firebase Console](https://console.firebase.google.com/) -> **Project Settings** (Gear icon) -> **General**.
            2. Scroll down to **Your apps** -> Select `com.funkytalk.app`.
            3. Click **Add fingerprint** and paste the **SHA-1** above (for both Debug and Release).
            4. Save!
            
            ---
            
            ### 📦 Download Assets:
            - **Release APKs**: `app-universal-release.apk`, `app-arm64-v8a-release.apk`, `app-armeabi-v7a-release.apk`
            - **Debug APKs**: `app-universal-debug.apk`, `app-arm64-v8a-debug.apk`, `app-armeabi-v7a-debug.apk`
            - **R8 Mapping**: `mapping.txt`
            - **Keystore files & SHA info**: `debug.keystore`, `funkytalk-release.keystore`, `SHA_FINGERPRINTS.txt`
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/mapping/release/mapping.txt
            keystore-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

