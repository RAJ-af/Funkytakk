name: Build and Generate Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Setup Environment Variables (.env)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APPLICATION_ID: ${{ secrets.FIREBASE_APPLICATION_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FUNKYTALK_BACKEND_URL: ${{ secrets.FUNKYTALK_BACKEND_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_TEMPLATE_ID: ${{ secrets.BREVO_TEMPLATE_ID }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            echo "Creating .env from GitHub Secret ENV_FILE..."
            echo "$ENV_FILE" > .env
          elif [ ! -f .env ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          else
            echo "Using existing .env file..."
          fi

          # Inject any individual secrets if provided in GitHub repository settings
          [ -n "$GEMINI_API_KEY" ] && sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=$GEMINI_API_KEY|" .env
          [ -n "$GOOGLE_WEB_CLIENT_ID" ] && sed -i "s|^GOOGLE_WEB_CLIENT_ID=.*|GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID|" .env
          [ -n "$FIREBASE_API_KEY" ] && sed -i "s|^FIREBASE_API_KEY=.*|FIREBASE_API_KEY=$FIREBASE_API_KEY|" .env
          [ -n "$FIREBASE_APPLICATION_ID" ] && sed -i "s|^FIREBASE_APPLICATION_ID=.*|FIREBASE_APPLICATION_ID=$FIREBASE_APPLICATION_ID|" .env
          [ -n "$FIREBASE_PROJECT_ID" ] && sed -i "s|^FIREBASE_PROJECT_ID=.*|FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID|" .env
          [ -n "$SUPABASE_URL" ] && sed -i "s|^SUPABASE_URL=.*|SUPABASE_URL=$SUPABASE_URL|" .env
          [ -n "$SUPABASE_ANON_KEY" ] && sed -i "s|^SUPABASE_ANON_KEY=.*|SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY|" .env
          [ -n "$FUNKYTALK_BACKEND_URL" ] && sed -i "s|^FUNKYTALK_BACKEND_URL=.*|FUNKYTALK_BACKEND_URL=$FUNKYTALK_BACKEND_URL|" .env
          [ -n "$BREVO_API_KEY" ] && sed -i "s|^BREVO_API_KEY=.*|BREVO_API_KEY=$BREVO_API_KEY|" .env
          [ -n "$BREVO_TEMPLATE_ID" ] && sed -i "s|^BREVO_TEMPLATE_ID=.*|BREVO_TEMPLATE_ID=$BREVO_TEMPLATE_ID|" .env

          echo "Environment configuration completed."

      - name: Build Debug APK with Gradle
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunkyTalk-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-build-${{ github.run_number }}
          name: "FunkyTalk Android APK (Build #${{ github.run_number }})"
          body: |
            ### FunkyTalk Automated Android APK Build
            
            - **Commit**: ${{ github.sha }}
            - **Build Number**: #${{ github.run_number }}
            - **Type**: Debug APK (Ready to install on Android)
            
            Download the APK from Assets below.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
