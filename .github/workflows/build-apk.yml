name: Build and Generate Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Environment Variables (.env)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APPLICATION_ID: ${{ secrets.FIREBASE_APPLICATION_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FUNKYTALK_BACKEND_URL: ${{ secrets.FUNKYTALK_BACKEND_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_TEMPLATE_ID: ${{ secrets.BREVO_TEMPLATE_ID }}
        run: |
          python3 -c '
          import os

          env_file = os.environ.get("ENV_FILE")
          if env_file:
              print("Creating .env from GitHub Secret ENV_FILE...")
              with open(".env", "w") as f:
                  f.write(env_file)
          elif not os.path.exists(".env"):
              print("Creating .env from .env.example...")
              with open(".env.example", "r") as src, open(".env", "w") as dst:
                  dst.write(src.read())
          else:
              print("Using existing .env file...")

          # Read current .env
          env_vars = {}
          if os.path.exists(".env"):
              with open(".env", "r") as f:
                  for line in f:
                      line = line.strip()
                      if line and not line.startswith("#") and "=" in line:
                          k, v = line.split("=", 1)
                          env_vars[k.strip()] = v.strip()

          # Override with any individual GitHub Secrets if provided
          keys_to_check = [
              "GEMINI_API_KEY",
              "GOOGLE_WEB_CLIENT_ID",
              "FIREBASE_API_KEY",
              "FIREBASE_APPLICATION_ID",
              "FIREBASE_PROJECT_ID",
              "SUPABASE_URL",
              "SUPABASE_ANON_KEY",
              "FUNKYTALK_BACKEND_URL",
              "BREVO_API_KEY",
              "BREVO_TEMPLATE_ID"
          ]

          for k in keys_to_check:
              val = os.environ.get(k)
              if val and val.strip():
                  env_vars[k] = val.strip()

          with open(".env", "w") as f:
              for k, v in env_vars.items():
                  f.write(f"{k}={v}\n")

          print("Configured .env keys:", list(env_vars.keys()))
          '
          echo "Environment configuration completed."

      - name: Build Debug APK with Gradle
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunkyTalk-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-build-${{ github.run_number }}
          name: "FunkyTalk Android APK (Build #${{ github.run_number }})"
          body: |
            ### FunkyTalk Automated Android APK Build
            
            - **Commit**: ${{ github.sha }}
            - **Build Number**: #${{ github.run_number }}
            - **Type**: Debug APK (Ready to install on Android)
            
            Download the APK from Assets below.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
