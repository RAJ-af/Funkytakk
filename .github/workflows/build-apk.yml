name: Build and Generate Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cleanup Old Workflow Artifacts to Free Storage Quota
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +x
          echo "Cleaning up older workflow artifacts to free GitHub Actions storage quota..."
          python3 -c '
          import os, subprocess, json
          token = os.environ.get("GH_TOKEN")
          repo = os.environ.get("GITHUB_REPOSITORY")
          if not token or not repo:
              exit(0)
          try:
              res = subprocess.run(["gh", "api", f"repos/{repo}/actions/artifacts?per_page=100"], capture_output=True, text=True)
              if res.returncode == 0:
                  data = json.loads(res.stdout)
                  artifacts = data.get("artifacts", [])
                  print(f"Found {len(artifacts)} old artifacts in {repo}. Cleaning up...")
                  for a in artifacts:
                      aid = a.get("id")
                      name = a.get("name", "unknown")
                      print(f"Deleting artifact ID {aid} ({name})...")
                      subprocess.run(["gh", "api", "--method", "DELETE", f"repos/{repo}/actions/artifacts/{aid}"], capture_output=True)
                  print("Artifact cleanup completed.")
          except Exception as e:
              print(f"Artifact cleanup note: {e}")
          ' || true
        continue-on-error: true

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Environment Variables (.env)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APPLICATION_ID: ${{ secrets.FIREBASE_APPLICATION_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FUNKYTALK_BACKEND_URL: ${{ secrets.FUNKYTALK_BACKEND_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_TEMPLATE_ID: ${{ secrets.BREVO_TEMPLATE_ID }}
        run: |
          set +x
          python3 -c '
          import os

          env_file = os.environ.get("ENV_FILE")
          if env_file:
              print("Creating .env from GitHub Secret ENV_FILE...")
              with open(".env", "w") as f:
                  f.write(env_file)
          elif not os.path.exists(".env"):
              print("Creating .env from .env.example...")
              with open(".env.example", "r") as src, open(".env", "w") as dst:
                  dst.write(src.read())
          else:
              print("Using existing .env file...")

          env_vars = {}
          if os.path.exists(".env"):
              with open(".env", "r") as f:
                  for line in f:
                      line = line.strip()
                      if line and not line.startswith("#") and "=" in line:
                          k, v = line.split("=", 1)
                          env_vars[k.strip()] = v.strip()

          keys_to_check = [
              "GEMINI_API_KEY",
              "GOOGLE_WEB_CLIENT_ID",
              "FIREBASE_API_KEY",
              "FIREBASE_APPLICATION_ID",
              "FIREBASE_PROJECT_ID",
              "SUPABASE_URL",
              "SUPABASE_ANON_KEY",
              "FUNKYTALK_BACKEND_URL",
              "BREVO_API_KEY",
              "BREVO_TEMPLATE_ID"
          ]

          for k in keys_to_check:
              val = os.environ.get(k)
              if val and val.strip():
                  env_vars[k] = val.strip()

          with open(".env", "w") as f:
              for k, v in env_vars.items():
                  f.write(f"{k}={v}\n")

          print("Configured .env keys:", list(env_vars.keys()))
          '
          echo "Environment configuration completed."

      - name: Ensure google-services.json is Present
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set +x
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Restoring google-services.json from GitHub secret..."
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f "app/google-services.json" ]; then
            echo "Creating app/google-services.json from default template configuration..."
            mkdir -p app
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1093102729820",
              "firebase_url": "https://funkytalk-f1aae-default-rtdb.asia-southeast1.firebasedatabase.app",
              "project_id": "funkytalk-f1aae",
              "storage_bucket": "funkytalk-f1aae.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1093102729820:android:adf5504386d9f6f184c499",
                  "android_client_info": {
                    "package_name": "com.funkytalk.app"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "1093102729820-4mdub6gveu7mbl6hf16e7pu1tvk2smeb.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.funkytalk.app",
                      "certificate_hash": "ca4a705395fcc3ec0316deff4392ca8a2bb5d164"
                    }
                  },
                  {
                    "client_id": "1093102729820-7dbvqkqf7uall5go8aasmsvs89keesq6.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyAZi997wGgWE7WJ-N5NO9kOWL2agpijq-8"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "1093102729820-7dbvqkqf7uall5go8aasmsvs89keesq6.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
          echo "Verified app/google-services.json exists."

      - name: Restore Keystores from Secrets & Export Signing Config
        id: keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +x
          python3 .github/scripts/setup_keystore.py

      - name: Build Debug & Release APKs with Gradle
        run: |
          set +x
          gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify Release APKs Signing (apksigner)
        env:
          EXPECTED_DEBUG_SHA256: ${{ steps.keystore.outputs.debug_sha256 }}
          EXPECTED_RELEASE_SHA256: ${{ steps.keystore.outputs.release_sha256 }}
          DEBUG_SHA1: ${{ steps.keystore.outputs.debug_sha1 }}
          RELEASE_SHA1: ${{ steps.keystore.outputs.release_sha1 }}
        run: |
          set +x
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "::error::Android SDK build-tools directory not found."
            exit 1
          fi

          APKSIGNER="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner executable not found under $SDK_ROOT/build-tools."
            exit 1
          fi

          norm_sha() {
            printf '%s' "$1" | tr -d ':' | tr '[:upper:]' '[:lower:]'
          }

          EXP_DEBUG="$(norm_sha "$EXPECTED_DEBUG_SHA256")"
          EXP_RELEASE="$(norm_sha "$EXPECTED_RELEASE_SHA256")"

          if [ -z "$EXP_DEBUG" ] || [ -z "$EXP_RELEASE" ]; then
            echo "::error::Missing expected SHA-256 fingerprints from keystore step."
            exit 1
          fi

          shopt -s nullglob
          RELEASE_APKS=(app/build/outputs/apk/release/*-release.apk)
          if [ "${#RELEASE_APKS[@]}" -eq 0 ]; then
            echo "::error::No *-release.apk files found to verify in app/build/outputs/apk/release/."
            exit 1
          fi

          echo "Expected DEBUG   SHA-1  : $DEBUG_SHA1"
          echo "Expected DEBUG   SHA-256: $EXPECTED_DEBUG_SHA256"
          echo "Expected RELEASE SHA-1  : $RELEASE_SHA1"
          echo "Expected RELEASE SHA-256: $EXPECTED_RELEASE_SHA256"

          for apk in "${RELEASE_APKS[@]}"; do
            echo "Verifying $apk..."
            CERT_OUT="$("$APKSIGNER" verify --print-certs "$apk")"
            APK_SHA256="$(printf '%s\n' "$CERT_OUT" | sed -n 's/.*SHA-256 digest:[[:space:]]*\([0-9a-fA-F:]*\).*/\1/p' | head -n1)"
            APK_SHA256_NORM="$(norm_sha "$APK_SHA256")"

            if [ -z "$APK_SHA256_NORM" ]; then
              echo "::error::Could not extract signer SHA-256 from $apk."
              exit 1
            fi

            if [ "$APK_SHA256_NORM" = "$EXP_DEBUG" ]; then
              echo "::error::$apk is signed by the DEBUG key instead of the release keystore!"
              exit 1
            fi

            if [ "$APK_SHA256_NORM" != "$EXP_RELEASE" ]; then
              echo "::error::$apk SHA-256 ($APK_SHA256_NORM) differs from release keystore SHA-256 ($EXP_RELEASE)."
              exit 1
            fi

            echo "OK: $apk matches RELEASE SHA-256."
          done

      - name: Check APK Outputs
        id: check_apk
        run: |
          set +x
          DEBUG_EXISTS=false
          RELEASE_EXISTS=false

          if compgen -G "app/build/outputs/apk/debug/*.apk" > /dev/null; then
            DEBUG_EXISTS=true
            echo "Found Debug APKs:"
            ls -lh app/build/outputs/apk/debug/*.apk
          else
            echo "::warning::No Debug APK files found in app/build/outputs/apk/debug/"
          fi

          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            RELEASE_EXISTS=true
            echo "Found Release APKs:"
            ls -lh app/build/outputs/apk/release/*.apk
          else
            echo "::warning::No Release APK files found in app/build/outputs/apk/release/"
          fi

          echo "debug_apk_exists=$DEBUG_EXISTS" >> "$GITHUB_OUTPUT"
          echo "release_apk_exists=$RELEASE_EXISTS" >> "$GITHUB_OUTPUT"

          if [ "$DEBUG_EXISTS" = "true" ] || [ "$RELEASE_EXISTS" = "true" ]; then
            echo "apk_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "apk_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add Build Status & Download Links to Summary
        if: (!cancelled()) && steps.check_apk.outputs.release_apk_exists == 'true'
        run: |
          set +x
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"

          ---

          ## Release APK Downloads

          | Asset | Direct Link |
          | :--- | :--- |
          | **Release Universal APK (Recommended)** | [Download app-universal-release.apk](https://github.com/${{ github.repository }}/releases/download/release-build-${{ github.run_number }}/app-universal-release.apk) |
          | **Release ARM64 APK** | [Download app-arm64-v8a-release.apk](https://github.com/${{ github.repository }}/releases/download/release-build-${{ github.run_number }}/app-arm64-v8a-release.apk) |
          | **GitHub Release Page** | [Open Release Build #${{ github.run_number }}](https://github.com/${{ github.repository }}/releases/tag/release-build-${{ github.run_number }}) |
          EOF

      - name: Upload Workflow APKs & Fingerprints Artifact
        if: (!cancelled()) && steps.check_apk.outputs.apk_exists == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-apks-build-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            ${{ steps.keystore.outputs.sha_fingerprints_file }}
          retention-days: 3

      - name: Create GitHub Release (Release APKs + SHA_FINGERPRINTS.txt)
        if: (!cancelled()) && steps.check_apk.outputs.release_apk_exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-build-${{ github.run_number }}
          name: "FunkyTalk Android Release (Build #${{ github.run_number }})"
          body: |
            ### FunkyTalk Android Release #${{ github.run_number }}

            - **Commit**: `${{ github.sha }}`
            - **Package**: `com.funkytalk.app`

            ### Signing Fingerprints
            - **DEBUG SHA-1**: `${{ steps.keystore.outputs.debug_sha1 }}`
            - **DEBUG SHA-256**: `${{ steps.keystore.outputs.debug_sha256 }}`
            - **RELEASE SHA-1**: `${{ steps.keystore.outputs.release_sha1 }}`
            - **RELEASE SHA-256**: `${{ steps.keystore.outputs.release_sha256 }}`
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            app/build/outputs/apk/release/*.apk
            ${{ steps.keystore.outputs.sha_fingerprints_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
