name: Generate Permanent Release Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-keystore:
    name: Generate Release Keystore (One-Time)
    runs-on: ubuntu-latest

    steps:
      - name: Safety Checks
        env:
          EXISTING_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set +x
          if [ -n "${EXISTING_KEYSTORE_BASE64//[[:space:]]/}" ]; then
            echo "::error::A release keystore secret already exists. Delete the KEYSTORE_BASE64 secret first if you really want a new key (a new key breaks Google Sign-In / Drive backup until the new SHA is added)."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ] || [ "${#KEYSTORE_PASSWORD}" -lt 6 ]; then
            echo "::error::KEYSTORE_PASSWORD secret must be set and at least 6 characters long."
            exit 1
          fi

          echo "Safety checks passed."

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate PKCS12 Keystore and Output Files
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set +x
          set -euo pipefail

          rm -rf out
          mkdir -p out

          keytool -genkeypair \
            -keystore out/release.keystore \
            -storetype PKCS12 \
            -alias funkytalk \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEYSTORE_PASSWORD \
            -dname "CN=FunkyTalk, OU=Mobile, O=FunkyTalk, L=New Delhi, ST=Delhi, C=IN"

          base64 -w0 out/release.keystore > out/release.keystore.base64.txt

          LIST_OUT="$(keytool -list -v -keystore out/release.keystore -alias funkytalk -storepass:env KEYSTORE_PASSWORD)"
          SHA1="$(printf '%s\n' "$LIST_OUT" | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' | head -n1)"
          SHA256="$(printf '%s\n' "$LIST_OUT" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n1)"

          if [ -z "$SHA1" ] || [ -z "$SHA256" ]; then
            echo "::error::Failed to extract RELEASE SHA-1 and SHA-256 fingerprints."
            exit 1
          fi

          cat <<EOF > out/SHA_FINGERPRINTS.txt
          Key Alias: funkytalk
          RELEASE SHA-1: ${SHA1}
          RELEASE SHA-256: ${SHA256}

          Add secrets: KEYSTORE_BASE64 = content of release.keystore.base64.txt, KEY_ALIAS = funkytalk, KEY_PASSWORD = same value as KEYSTORE_PASSWORD. Then add the SHA-1 and SHA-256 above to Firebase (Project settings > your Android app) and to the Android OAuth client in Google Cloud.
          EOF

          {
            echo "RELEASE SHA-1: ${SHA1}"
            echo "RELEASE SHA-256: ${SHA256}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Generated 3 files in out/ cleanly."

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-files
          path: out/
          retention-days: 1
          if-no-files-found: error
