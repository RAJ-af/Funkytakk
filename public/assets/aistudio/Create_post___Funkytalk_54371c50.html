<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create post – Funkytalk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
:root{--sheet:#FFFBF0;--ink:#1B1608;--muted:#7A7260;--line:#EADFC4;--chip:#F6EBCB;--mango:#FFC21A;--mango-ink:#2A1E00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:#F3EAD0;font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--mango);outline-offset:2px}
.app{position:relative;height:100%;max-width:430px;margin:0 auto;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);transition:background .35s}
.app::before{content:"";position:absolute;inset:0;background:var(--photo,none) center/cover;opacity:.95}
.app::after{content:"";position:absolute;inset:0;pointer-events:none;background:var(--ov,none)}
.app>*{position:relative;z-index:1}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.glass{background:#FFFBF0e6;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#1B1608;box-shadow:0 0 0 1px #0000001a}
.x{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.post{height:42px;padding:0 22px;border-radius:21px;background:var(--mango);color:var(--mango-ink);font-weight:800;font-size:16px;transition:opacity .2s}
.post:disabled{opacity:.35;cursor:not-allowed}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.canvas{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;padding:8px 26px;color:var(--tx,#fff)}
textarea{width:100%;border:0;background:none;color:inherit;resize:none;font-family:inherit;padding:0;overflow:hidden}
textarea::placeholder{color:inherit;opacity:.55}
#title{font-size:36px;line-height:1.08;font-weight:800;letter-spacing:-.02em}
#body{font-size:18px;line-height:1.4;margin-top:12px;font-weight:400}
.count{margin-top:8px;font-size:13px;opacity:.7;text-align:right}
.fix{align-self:flex-start;margin-top:14px;display:inline-flex;gap:8px;align-items:center;padding:9px 14px;border-radius:20px;font-size:14px;font-weight:600;background:#FFFBF0e6;color:#1B1608;box-shadow:0 0 0 1px #0000001a}
.fix[aria-pressed="true"]{background:var(--mango);color:var(--mango-ink)}
.meta{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px 10px;min-height:34px}
.meta span{padding:6px 11px;border-radius:16px;font-size:13px;font-weight:600}
.dock{margin:0 14px 12px;padding:6px;border-radius:30px;display:flex;justify-content:space-between}
.dock button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:24px;font-size:11px;font-weight:600;color:#6B6350}
.dock button.on{background:var(--mango);color:var(--mango-ink)}
.scrim{position:absolute;inset:0;z-index:5;background:#0007;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);color:var(--ink);border-radius:26px 26px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:70%;overflow-y:auto;box-shadow:0 -10px 30px #0000003d}
.sheet.open{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sh h2{margin:0;font-size:20px;font-weight:800}
.done{color:var(--mango-ink);background:var(--mango);padding:8px 18px;border-radius:18px;font-weight:700}
.hint{margin:0 0 12px;font-size:14px;color:var(--muted);line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.c{padding:10px 15px;border-radius:20px;background:var(--chip);font-size:15px;font-weight:600;color:var(--ink);border:2px solid transparent}
.c[aria-pressed="true"]{border-color:var(--mango);background:#FFC21A33}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw button{aspect-ratio:1;border-radius:18px;border:3px solid transparent;box-shadow:inset 0 0 0 1px #0002}
.sw button[aria-pressed="true"]{border-color:var(--ink)}
.field{width:100%;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--sheet);color:var(--ink);font:inherit;font-size:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line);margin-top:16px;font-weight:600}
.sw2{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .2s}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw2[aria-pressed="true"]{background:var(--mango)}
.sw2[aria-pressed="true"]::after{transform:translateX(20px)}
.toast{position:absolute;z-index:9;left:50%;top:72px;transform:translate(-50%,-20px);opacity:0;background:var(--mango);color:var(--mango-ink);padding:12px 20px;border-radius:22px;font-weight:700;transition:.3s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <button class="x glass" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button class="post" id="post" disabled>Post</button>
  </div>

  <div class="canvas" id="canvas">
    <textarea id="title" rows="1" maxlength="60" placeholder="Give it a title" aria-label="Title"></textarea>
    <textarea id="body" rows="3" maxlength="400" placeholder="What’s on your mind? Write in the language you’re practising." aria-label="Post text"></textarea>
    <div class="count"><span id="n">0</span>/400</div>
    <button class="fix" id="fix" aria-pressed="true">✏️ Ask native speakers to correct me</button>
  </div>

  <div class="meta" id="meta"></div>

  <nav class="dock glass" id="dock">
    <button data-p="media"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>Media</button>
    <button data-p="bg"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 010 17z" fill="currentColor"/></svg>Background</button>
    <button data-p="lang"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>Language</button>
    <button data-p="topics"><svg viewBox="0 0 24 24"><path d="M5 9h14M5 15h14M10 4L8 20M16 4l-2 16"/></svg>Topics</button>
    <button data-p="loc"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Location</button>
  </nav>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <div class="sh"><h2 id="sh-t"></h2><button class="done" id="done">Done</button></div>

    <div data-panel="media">
      <p class="hint">A photo fills the whole screen, like in the feed. Your text sits on top of it.</p>
      <div class="chips">
        <button class="c" id="pick">📷 Choose photo or video</button>
        <button class="c" id="rm" hidden>Remove media</button>
      </div>
      <input type="file" id="file" accept="image/*,video/*" hidden>
    </div>

    <div data-panel="bg" hidden>
      <p class="hint">For text-only posts. Pick the colour your words sit on.</p>
      <div class="sw" id="sw"></div>
    </div>

    <div data-panel="lang" hidden>
      <p class="hint">Which language is this post in?</p>
      <div class="chips" id="langs"></div>
      <div class="row"><span>Show a translation line</span><button class="sw2" id="tr" aria-pressed="false" aria-label="Show a translation line"></button></div>
    </div>

    <div data-panel="topics" hidden>
      <p class="hint">Pick up to 3 so the right people find it.</p>
      <div class="chips" id="tops"></div>
    </div>

    <div data-panel="loc" hidden>
      <input class="field" id="locin" placeholder="Search a city" aria-label="Location">
      <div class="chips" id="locs"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status">Posted. It’s live in Trending.</div>
</div>

<script>
const $=s=>document.querySelector(s);
const BG=[
 {g:'linear-gradient(160deg,#FFFBF0,#FFEFC2)',t:'#1B1608'},
 {g:'linear-gradient(160deg,#FFC21A,#FF8A1F)',t:'#2A1E00'},
 {g:'linear-gradient(160deg,#7C3AED,#EC4899)',t:'#fff'},
 {g:'linear-gradient(160deg,#06B6D4,#2563EB)',t:'#fff'},
 {g:'linear-gradient(160deg,#1E1B4B,#6D28D9)',t:'#fff'},
 {g:'linear-gradient(160deg,#FF9A8B,#FF5E7E)',t:'#fff'},
 {g:'linear-gradient(160deg,#BEF264,#16A34A)',t:'#0F2A10'},
 {g:'linear-gradient(160deg,#475569,#0F172A)',t:'#fff'}];
const LANGS=['🇮🇳 Hindi','🇬🇧 English','🇰🇷 Korean','🇨🇳 Mandarin','🇯🇵 Japanese','🇲🇾 Malay'];
const TOPS=['Travel','Daily life','Food','Study','Nature','Culture','Music','City'];
const LOCS=['Kuala Lumpur','Seoul','New Delhi','Taipei'];
const S={bg:0,photo:null,video:null,lang:'🇬🇧 English',tr:false,tops:[],loc:'',fix:true};
const TITLES={media:'Add media',bg:'Background',lang:'Post language',topics:'Topics',loc:'Location'};

const sw=$('#sw');BG.forEach((b,i)=>{const e=document.createElement('button');e.style.background=b.g;e.setAttribute('aria-label','Background '+(i+1));e.onclick=()=>{S.bg=i;render()};sw.append(e)});
function chips(box,list,fn,sel){box.innerHTML='';list.forEach(v=>{const b=document.createElement('button');b.className='c';b.textContent=v;b.setAttribute('aria-pressed',sel(v));b.onclick=()=>fn(v);box.append(b)})}

function size(t){t.style.height='auto';t.style.height=t.scrollHeight+'px'}
['#title','#body'].forEach(s=>$(s).addEventListener('input',()=>{size($(s));render()}));

function render(){
 const app=$('#app'),b=BG[S.bg];
 app.style.setProperty('--bg',b.g);
 app.style.setProperty('--tx',S.photo||S.video?'#fff':b.t);
 app.style.setProperty('--photo',S.photo?`url(${S.photo})`:'none');
 if(S.video&&!S.photo)app.style.setProperty('--bg','linear-gradient(160deg,#0f172a,#000)');
 app.style.setProperty('--ov',S.photo||S.video?'linear-gradient(#0006,#0000 22%,#0000 55%,#0008)':'none');
 [...sw.children].forEach((e,i)=>e.setAttribute('aria-pressed',i===S.bg&&!S.photo));
 $('#n').textContent=$('#body').value.length;
 $('#fix').setAttribute('aria-pressed',S.fix);
 $('#tr').setAttribute('aria-pressed',S.tr);
 $('#rm').hidden=!(S.photo||S.video);
 $('#pick').textContent=(S.photo||S.video)?'📷 Change media':'📷 Choose photo or video';
 chips($('#langs'),LANGS,v=>{S.lang=v;render()},v=>v===S.lang);
 chips($('#tops'),TOPS,v=>{S.tops=S.tops.includes(v)?S.tops.filter(x=>x!==v):S.tops.length<3?[...S.tops,v]:S.tops;render()},v=>S.tops.includes(v));
 chips($('#locs'),[...LOCS,'Hide location'],v=>{S.loc=v==='Hide location'?'':v;$('#locin').value=S.loc;render()},v=>v===S.loc);
 const m=$('#meta');m.innerHTML='';
 const add=t=>{const s=document.createElement('span');s.className='glass';s.textContent=t;m.append(s)};
 add(S.lang);if(S.tr)add('Translation line on');S.tops.forEach(t=>add('#'+t.replace(' ','')));if(S.loc)add('📍 '+S.loc);
 if(S.video)add('🎬 Video added');
 $('#post').disabled=!($('#title').value.trim()||$('#body').value.trim()||S.photo||S.video);
}

/* sheet */
let cur=null;
function open(p){cur=p;$('#sh-t').textContent=TITLES[p];document.querySelectorAll('[data-panel]').forEach(e=>e.hidden=e.dataset.panel!==p);
 $('#sheet').classList.add('open');$('#scrim').classList.add('open');
 document.querySelectorAll('#dock button').forEach(b=>b.classList.toggle('on',b.dataset.p===p))}
function close(){$('#sheet').classList.remove('open');$('#scrim').classList.remove('open');document.querySelectorAll('#dock button').forEach(b=>b.classList.remove('on'))}
document.querySelectorAll('#dock button').forEach(b=>b.onclick=()=>open(b.dataset.p));
$('#scrim').onclick=close;$('#done').onclick=close;
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});

/* media */
$('#pick').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;
 if(f.type.startsWith('image/')){const r=new FileReader();r.onload=()=>{S.photo=r.result;S.video=null;render()};r.readAsDataURL(f)}
 else{S.video=f.name;S.photo=null;render()}};
$('#rm').onclick=()=>{S.photo=S.video=null;$('#file').value='';render()};

$('#locin').addEventListener('input',e=>{S.loc=e.target.value;render()});
$('#fix').onclick=()=>{S.fix=!S.fix;render()};
$('#tr').onclick=()=>{S.tr=!S.tr;render()};

$('#post').onclick=()=>{const t=$('#toast');t.classList.add('show');
 setTimeout(()=>{t.classList.remove('show');
  $('#title').value=$('#body').value='';size($('#title'));size($('#body'));
  Object.assign(S,{bg:0,photo:null,video:null,tops:[],loc:'',tr:false});$('#locin').value='';render()},1800)};
render();
</script>
</body>
</html>
