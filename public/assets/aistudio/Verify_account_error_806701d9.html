<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Verify account</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap">
<style>
:root{--bg:#FFF8E7;--surf:#FFFFFF;--soft:#FFEFC2;--ink:#2B2118;--mute:#8A7B66;--mango:#FFB627;--on-mango:#2B2118;--line:#F0E3C4;--bad:#FF5A4D;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16120D;--surf:#231D15;--soft:#3A2D12;--ink:#FFF3DC;--mute:#A89A82;--line:#34291A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16120D;--surf:#231D15;--soft:#3A2D12;--ink:#FFF3DC;--mute:#A89A82;--line:#34291A;color-scheme:dark}
html{height:100%}*{box-sizing:border-box;margin:0}
body{min-height:100%;background:var(--bg);color:var(--ink);font:500 15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;transition:transform .12s}button:active{transform:scale(.96)}[hidden]{display:none!important}
.ic{width:1.2em;height:1.2em;flex:none;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;padding:16px 24px 28px}
.top{display:flex;justify-content:flex-end}.ib{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center}.ib .ic{width:22px;height:22px}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.orb{width:190px;height:190px;border-radius:50%;background:var(--soft);display:grid;place-items:center;position:relative;margin-bottom:28px}
.orb::before,.orb::after{content:"";position:absolute;inset:-18px;border-radius:50%;border:2px solid var(--line);animation:ring 2.4s ease-out infinite}.orb::after{animation-delay:1.2s}
@keyframes ring{from{transform:scale(.85);opacity:1}to{transform:scale(1.25);opacity:0}}
.orb .core{width:104px;height:104px;border-radius:34px;background:var(--mango);color:var(--on-mango);display:grid;place-items:center;transform:rotate(-8deg);animation:wob 3s ease-in-out infinite}.orb .core .ic{width:56px;height:56px;--fo:.28}
@keyframes wob{50%{transform:rotate(7deg) translateY(-4px)}}
.orb.shake .core{animation:shk .4s}@keyframes shk{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
h1{font:800 30px/1.1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.sub{color:var(--mute);margin-top:10px;max-width:300px}
.code{margin-top:16px;display:inline-flex;gap:8px;align-items:center;background:var(--soft);padding:7px 14px;border-radius:99px;font-weight:700;font-size:13px}.code i{width:8px;height:8px;border-radius:50%;background:var(--bad)}
.btns{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.btn{height:58px;border-radius:99px;display:flex;align-items:center;justify-content:center;gap:8px;font:800 17px "Bricolage Grotesque",sans-serif}
.main{background:var(--mango);color:var(--on-mango);box-shadow:0 8px 24px rgba(255,182,39,.3)}.ghost{border:2px solid var(--line);color:var(--ink)}
.spin .ic{animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.help{text-align:center;color:var(--mute);font-size:13px;margin-top:16px}.help b{color:var(--ink)}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:700}

Box="0 0 24 24"><path d="M12 4l1.8 4.7 4.7 1.8-4.7 1.8L12 17l-1.8-4.7L5.5 10.5l4.7-1.8z" fill="currentColor" style="fill-opacity:var(--fo,.2)"/><path d="M18 16v3M16.5 17.5h3"/></symbol><symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 5.2 3.9 16.3a2.3 2.3 0 0 0 2 3.4h12.2a2.3 2.3 0 0 0 2-3.4L13.7 5.2a2 2 0 0 0-3.4 0z" fill="currentColor" style="fill-opacity:var(--fo,.2)"/><path d="M12 9.5v4M12 16.8h.01"/></symbol><symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 5H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3"/><path d="M14 8l4 4-4 4M18 12H9"/></symbol><symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 4c4.600 0 8 3.100 8 7 0 2.600-2 3.500-3.700 3.500-1.300 0-1.800.7-1.800 1.500 0 .8.6 1.300.6 2 0 .9-1 2-3.100 2C7.300 20 4 16.600 4 12c0-4.400 3.600-8 8-8z" fill="currentColor" style="fill-opacity:var(--fo,.2)"/><path d="M8.500 11h.01M12 8h.01M15.500 10h.01"/></symbol></svg>
<div class="app">
 <div class="top"><button class="ib" id="theme" aria-label="Toggle theme"><svg class="ic "><use href="#i-moon"/></svg></button></div>
 <div class="mid">
  <div class="orb" id="orb"><div class="core"><svg class="ic "><use href="#i-alert"/></svg></div></div>
  <h1>Hmm, we couldn’t verify you</h1>
  <p class="sub" id="sub">Your session may have expired or the connection dropped. Give it another go.</p>
  <span class="code"><i></i>Error 401 · Unauthorized</span>
 </div>
 <div class="btns"><button class="btn main" id="retry"><svg class="ic "><use href="#i-refresh"/></svg> <span>Try again</span></button><button class="btn ghost" id="out"><svg class="ic "><use href="#i-logout"/></svg> Log out</button></div>
 <p class="help">Still stuck? <b>Contact support</b></p>
</div>
<div class="toast" id="ts" hidden></div>
<script>
function ico(n){return '<svg class="ic"><use href="#i-'+n+'"/></svg>'}function $(i){return document.getElementById(i)}
var r=document.documentElement,dark=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
function set(d){r.setAttribute('data-theme',d?'dark':'light');$('theme').innerHTML=ico(d?'sun':'moon')}set(dark);$('theme').onclick=function(){dark=!dark;set(dark)};
var n=0,b=$('retry');
b.onclick=function(){b.classList.add('spin');b.querySelector('span').textContent='Checking…';setTimeout(function(){b.classList.remove('spin');n++;b.querySelector('span').textContent='Try again';var o=$('orb');o.classList.remove('shake');void o.offsetWidth;o.classList.add('shake');$('sub').textContent=n>1?'Still no luck. Logging out and back in usually fixes this.':'Still can’t reach your account. Check your connection and retry.'},1200)};
$('out').onclick=function(){var t=$('ts');t.textContent='Logged out';t.hidden=false;setTimeout(function(){t.hidden=true},1800)};
</script></body></html>
