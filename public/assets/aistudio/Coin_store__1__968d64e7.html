<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Coin store</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap">
<style>
:root{--bg:#FFF8E7;--surf:#FFFFFF;--soft:#FFEFC2;--ink:#2B2118;--mute:#8A7B66;--mango:#FFB627;--on-mango:#2B2118;--line:#F0E3C4;--ok:#22B573;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16120D;--surf:#231D15;--soft:#3A2D12;--ink:#FFF3DC;--mute:#A89A82;--line:#34291A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16120D;--surf:#231D15;--soft:#3A2D12;--ink:#FFF3DC;--mute:#A89A82;--line:#34291A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:500 15px/1.4 "Plus Jakarta Sans",system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:430px;min-height:100vh;padding:0 16px 130px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;transition:transform .12s}button:active{transform:scale(.97)}[hidden]{display:none!important}
.ic{width:1.2em;height:1.2em;flex:none;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 12px}.top h1{font:800 22px "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.ib{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center}.ib .ic{width:22px;height:22px}
.hero{border-radius:36px;padding:22px 22px 20px;background:linear-gradient(145deg,#FFC94D,#FFA51F);color:#2B2118;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.28)}.hero::before{content:"";position:absolute;right:30px;bottom:-60px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.18)}
.hero small{font-weight:700;opacity:.75}.bal{font:800 54px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;margin:6px 0 2px;display:flex;align-items:center;gap:10px}
.bal .coin{width:46px;height:46px;border-radius:50%;background:#2B2118;color:#FFC94D;display:grid;place-items:center}.bal .coin .ic{width:26px;height:26px;--fo:.3}
.hero p{font-size:13px;opacity:.8;position:relative;z-index:1}.hero>*{position:relative;z-index:1}
.uses{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.use{display:flex;gap:5px;align-items:center;background:rgba(255,255,255,.5);border-radius:99px;padding:6px 12px 6px 9px;font-weight:700;font-size:12.5px}.use .ic{width:16px;height:16px}
.sec{margin-top:24px}.sec h2{font:800 18px "Bricolage Grotesque",sans-serif;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline}.sec h2 small{color:var(--mute);font:600 12px "Plus Jakarta Sans",sans-serif}
.pk{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--surf);border:3px solid var(--line);border-radius:30px;padding:14px 16px;margin-bottom:10px;position:relative;transition:border-color .15s,background .15s}
.pk.on{border-color:var(--mango);background:var(--soft)}
.stack{width:78px;display:flex;align-items:center;flex:none}.stack i{width:34px;height:34px;border-radius:50%;background:var(--mango);color:var(--on-mango);display:grid;place-items:center;margin-left:-16px;box-shadow:0 0 0 3px var(--surf)}.pk.on .stack i{box-shadow:0 0 0 3px var(--soft)}.stack i:first-child{margin-left:0}.stack .ic{width:19px;height:19px;--fo:.3}
.pk b{display:block;font:800 22px "Bricolage Grotesque",sans-serif;line-height:1.1}.pk small{color:var(--mute);font-size:12.5px;font-weight:600}.pk .bn{color:var(--ok);font-weight:700}
.pk .px{margin-left:auto;background:var(--ink);color:var(--bg);border-radius:99px;padding:9px 16px;font-weight:800;font-size:15px}
.pk em{position:absolute;top:-10px;left:18px;background:var(--mango);color:var(--on-mango);font:700 11px "Plus Jakarta Sans",sans-serif;padding:3px 10px;border-radius:99px;font-style:normal}
.rd{width:24px;height:24px;border-radius:50%;border:3px solid var(--line);flex:none;display:grid;place-items:center;color:transparent}.pk.on .rd{background:var(--mango);border-color:var(--mango);color:var(--on-mango)}.rd .ic{width:14px;height:14px;stroke-width:3}
.sec2{margin-top:6px;display:flex;gap:8px;align-items:center;justify-content:center;color:var(--mute);font-size:12.5px;font-weight:600;text-align:center}.sec2 .ic{width:15px;height:15px}
.bar{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:398px;z-index:8}
.cta{width:100%;height:60px;border-radius:99px;background:var(--mango);color:var(--on-mango);font:800 18px "Bricolage Grotesque",sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 26px rgba(255,182,39,.4)}.cta .ic{width:22px;height:22px;--fo:.3}
.done{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden}
.done .big{width:130px;height:130px;border-radius:50%;background:var(--mango);color:var(--on-mango);display:grid;place-items:center;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}.done .big .ic{width:68px;height:68px;stroke-width:2.6}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
.done h2{font:800 34px "Bricolage Grotesque",sans-serif;margin-top:22px;letter-spacing:-.02em}.done p{color:var(--mute);margin:6px 0 22px}.done .nb{display:inline-flex;gap:8px;align-items:center;background:var(--soft);padding:10px 20px;border-radius:99px;font:800 20px "Bricolage Grotesque",sans-serif;margin-bottom:26px}.done .nb .ic{width:22px;height:22px;color:var(--mango)}
.done .cta{max-width:330px;box-shadow:none}.cf{position:absolute;top:34%;left:50%;width:10px;height:10px;border-radius:3px;opacity:0;animation:cf 1.3s ease-out forwards}
@keyframes cf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(540deg)}}
